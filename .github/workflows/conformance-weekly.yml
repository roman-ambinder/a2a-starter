name: Conformance weekly

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tck-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the TCK at main
        id: tck
        run: |
          set -o pipefail
          bash tck/run-ci.sh main 2>&1 | tee "$RUNNER_TEMP/tck-main.log"

      - name: Open an issue for new failures
        if: failure() && steps.tck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="TCK main: new failures"
          existing=$(gh issue list --state open --search "\"$prefix\" in:title" --json title --jq "[.[] | select(.title | startswith(\"$prefix\"))] | length")
          if [ "$existing" != "0" ]; then
            echo "An open issue already exists; not opening another."
            exit 0
          fi
          {
            echo "The weekly TCK run against a2a-tck main failed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/tck-main.log"
            echo '```'
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "$prefix ($(date -u +%F))" --body-file "$RUNNER_TEMP/issue-body.md"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tck-main-reports
          path: |
            ${{ runner.temp }}/a2a-tck/reports/
            ${{ runner.temp }}/sut.log
          if-no-files-found: warn

  spec-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for a new A2A release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/a2aproject/A2A/releases/latest --jq .tag_name)
          if [ "$tag" = "v1.0.1" ]; then
            echo "Latest A2A release is still v1.0.1."
            exit 0
          fi
          title="A2A $tag released"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "An open issue already exists; not opening another."
            exit 0
          fi
          gh issue create --title "$title" --body "The latest A2A release is $tag. This repo targets v1.0.1. Review the changes and plan an upgrade."
