name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore A2A.Reference.slnx

      - name: Build
        run: dotnet build A2A.Reference.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test A2A.Reference.slnx --no-build --configuration Release

  proto-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Vendored proto equals the pinned A2A release
        run: |
          set -euo pipefail
          tag=v1.0.1
          curl -sSfL "https://raw.githubusercontent.com/a2aproject/A2A/${tag}/specification/a2a.proto" -o "$RUNNER_TEMP/a2a.proto"
          diff -u "$RUNNER_TEMP/a2a.proto" proto/a2a.proto
          expected=$(sed -n 's/^- SHA-256 of `a2a.proto`: //p' proto/README.md)
          actual=$(sha256sum proto/a2a.proto | cut -d' ' -f1)
          test "$expected" = "$actual" || { echo "proto/README.md hash $expected does not match $actual"; exit 1; }

  tck:
    # advisory until 2026-11-17, then required (C13)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the A2A TCK
        run: bash tck/run-ci.sh "$(cat tck/TCK_VERSION)"

      - name: Upload TCK reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tck-reports
          path: |
            ${{ runner.temp }}/a2a-tck/reports/
            ${{ runner.temp }}/sut.log
          if-no-files-found: warn
