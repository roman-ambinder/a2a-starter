name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore A2A.Reference.slnx

      - name: Build
        run: dotnet build A2A.Reference.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test A2A.Reference.slnx --no-build --configuration Release
