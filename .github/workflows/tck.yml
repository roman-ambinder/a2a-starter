name: TCK

# The A2A TCK against tests/Ambinder.A2A.Tck.Sut on all three transports (package 03). ci.yml and tck-weekly.yml call it.
on:
  workflow_call:
    inputs:
      tck-ref:
        description: TCK git ref to test against; empty means the pinned commit in tck/TCK_VERSION
        type: string
        default: ''
permissions:
  contents: read
jobs:
  tck:
    # Not continue-on-error. Whether the check blocks a merge is set in branch protection (package 12).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Report checker unit tests
        run: python3 -I tck/test_check_report.py -v

      # One implementation for CI and local runs: builds and starts the SUT, checks out the TCK,
      # runs it once per transport (jsonrpc, http_json, grpc), copies each report to tck-reports/<transport>/,
      # and runs the checker. The TCK's own exit code is ignored on purpose: the checker grades MUST and SHOULD.
      - name: Run the TCK on all three transports and check the reports
        env:
          TCK_REF: ${{ inputs.tck-ref }}
        run: bash tck/run-ci.sh "$TCK_REF"

      - name: Collect the SUT log
        if: always()
        run: |
          mkdir -p tck-reports
          cp "$RUNNER_TEMP/sut.log" tck-reports/ || true

      # One root (tck-reports/), so checker-output.txt sits at the top of the artifact.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-reports
          path: tck-reports/
          if-no-files-found: warn
