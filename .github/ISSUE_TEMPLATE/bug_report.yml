name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems use the private report link on the issue chooser instead.
  - type: textarea
    id: packages
    attributes:
      label: Package IDs and versions
      description: Every Ambinder.A2A.* package you reference, with its version.
      placeholder: |
        Ambinder.A2A.AspNetCore 0.1.0-preview.1
        Ambinder.A2A.Client 0.1.0-preview.1
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A small project or the smallest code that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces and relevant logs.
    validations:
      required: true
