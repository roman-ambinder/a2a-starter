# A2A reference stack. Start:  docker compose up -d --wait
# Run the demo flows:          docker compose run --rm client all
# Inside the network the services use host names (mock-entra, agent-server, webhook-receiver); config keys are
# overridden with environment variables (double underscore = ":"). All secrets here are throwaway dev values.
name: a2a-reference

services:
  mock-entra:
    build: { context: ., dockerfile: docker/Dockerfile.mockentra }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Issuer in tokens and discovery documents; must match what agent-server validates against.
      MockEntra__IssuerBaseUrl: http://mock-entra:5100
      # appsettings.Development.json binds localhost only; bind all interfaces in the container.
      Urls: http://0.0.0.0:5100
    ports:
      - "5100:5100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5100/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  webhook-receiver:
    build: { context: ., dockerfile: docker/Dockerfile.webhook }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Receiver__TrustedServers__0: http://agent-server:5200
      Receiver__PublicUrl: http://webhook-receiver:5300
    ports:
      - "5300:5300"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5300/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent-server:
    build: { context: ., dockerfile: docker/Dockerfile.agentserver }
    depends_on:
      mock-entra:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # PublicBaseUrl host is not localhost, so Kestrel binds all interfaces (0.0.0.0) inside the container.
      A2A__PublicBaseUrl: http://agent-server:5200
      Auth__Authority: http://mock-entra:5100/a2a00000-0000-0000-0000-000000000001/v2.0
      Auth__TokenUrl: http://mock-entra:5100/a2a00000-0000-0000-0000-000000000001/oauth2/v2.0/token
      Auth__OpenIdConfigurationUrl: http://mock-entra:5100/a2a00000-0000-0000-0000-000000000001/v2.0/.well-known/openid-configuration
    ports:
      - "5200:5200"
      - "5201:5201"
      - "5202:5202"
      - "5203:5203"
      - "5204:5204"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5200/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    profiles: ["tools"]
    build: { context: ., dockerfile: docker/Dockerfile.client }
    depends_on:
      agent-server:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy
    # Default command; `docker compose run --rm client all` replaces "all" but keeps the entrypoint.
    command: ["all", "--server", "http://agent-server:5200", "--receiver", "http://webhook-receiver:5300"]

  # Phase 2 only: a local LLM. Not wired to any agent in Phase 1 (agents use the fake chat client).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
